      <rect x="1" y="7" width="5" height="5" fill="#059669" stroke="#ffffff" stroke-width="0.6" rx="0.8"/>
      <rect x="13" y="7" width="5" height="5" fill="#059669" stroke="#ffffff" stroke-width="0.6" rx="0.8"/>
      <rect x="7" y="6" width="5" height="7" fill="#F8FAFC" stroke="#047857" stroke-width="0.8" rx="0.8"/>
