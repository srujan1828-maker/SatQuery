    <g id="logo-python" transform="scale(0.7)">
      <path d="M9.8 2.5c-3.5 0-3.2 1.5-3.2 1.5l.03 1.6h3.2v.5H5.2S3 5.8 3 9.3s2 3.4 2 3.4h1.1v-1.6c0-1.9 1.6-1.9 1.6-1.9h3.2c1.6 0 1.6-1.5 1.6-1.5V4.2c0-1.7-2.7-1.7-2.7-1.7zm-.9 1c.3 0 .6.2.6.6s-.3.6-.6.6-.6-.2-.6-.6.3-.6.6-.6z" fill="#387EB8"/>
