    </g>

    <!-- Pydantic -->
    <g id="logo-pydantic" transform="scale(0.7)">
      <rect x="2" y="2" width="16" height="16" rx="3.5" fill="#E92063"/>
      <text x="10" y="14" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">p</text>
    </g>

    <!-- Docker -->
    <g id="logo-docker" transform="scale(0.7)">
      <rect x="2" y="7.5" width="2.5" height="2.5" fill="#2496ED" rx="0.4"/>
      <rect x="5.5" y="7.5" width="2.5" height="2.5" fill="#2496ED" rx="0.4"/>
      <rect x="9" y="7.5" width="2.5" height="2.5" fill="#2496ED" rx="0.4"/>
      <rect x="5.5" y="4.2" width="2.5" height="2.5" fill="#2496ED" rx="0.4"/>
      <rect x="9" y="4.2" width="2.5" height="2.5" fill="#2496ED" rx="0.4"/>
      <rect x="12.5" y="7.5" width="2.5" height="2.5" fill="#2496ED" rx="0.4"/>
      <path d="M18.5 9c-.4-.3-1.2-.4-1.8-.2c-.2-.6-.8-1-1.4-1.2v.5c0 1.6-1.6 2.8-4 2.8H2c0 3.2 2.4 5.2 6.4 5.2s7.2-2 8.8-5.2c.6 0 1.4-.5 1.6-1.2c-.3-.3-.6-.6-.8-.7z" fill="#2496ED"/>
