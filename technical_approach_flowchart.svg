<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 755" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="114%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/>
      <feOffset dx="0" dy="2.5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gemini Gradient -->
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A73E8"/>
      <stop offset="50%" stop-color="#8E24AA"/>
      <stop offset="100%" stop-color="#EA4335"/>
    </linearGradient>

    <!-- Marker Arrows -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0055A5"/>
    </marker>
    <marker id="arrowVqa" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowCd" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrowFusion" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>

    <!-- ================= COMPACT STANDALONE LOGO DEFINITIONS (14x14px) ================= -->

    <!-- React -->
    <g id="logo-react" transform="scale(0.7)">
      <ellipse cx="10" cy="10" rx="9.5" ry="3.6" fill="none" stroke="#00b4d8" stroke-width="1.5"/>
      <ellipse cx="10" cy="10" rx="9.5" ry="3.6" fill="none" stroke="#00b4d8" stroke-width="1.5" transform="rotate(60 10 10)"/>
      <ellipse cx="10" cy="10" rx="9.5" ry="3.6" fill="none" stroke="#00b4d8" stroke-width="1.5" transform="rotate(120 10 10)"/>
      <circle cx="10" cy="10" r="1.8" fill="#00b4d8"/>
    </g>

    <!-- Vite -->
    <g id="logo-vite" transform="scale(0.7)">
      <path d="M17 3L10 18L3 3h4.5l2.5 6l2.5-6z" fill="#41D1FF"/>
      <path d="M10 18L16.5 4l-4 0.5l-2.5 5.5l-1.5-3l-5.5-3.5z" fill="#BD34FE" opacity="0.9"/>
      <path d="M9 1.5L4 10.5h4l-1.5 6.5l7.5-9.5h-4l2.5-5.5z" fill="#FFDF00"/>
    </g>

